<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mátrix Labor — Vezénylési Rendszer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --green: #238636;
            --red: #da3633;
            --purple: #8957e5;
            --yellow: #9e6a03;
            --blue: #1f6feb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 5px;
            font-size: 1.5rem;
        }
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        select, input, button {
            background: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        button {
            background: var(--blue);
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #388bfd; }

        .palette {
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .palette span { font-size: 0.85rem; font-weight: bold; color: #8b949e; margin-right: 5px; }
        .p-btn { padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-np { background: var(--green); color: white; }
        .btn-ep { background: var(--red); color: white; }
        .btn-nep { background: var(--purple); color: white; }
        .btn-szb { background: var(--yellow); color: white; }
        .btn-szab { background: var(--blue); color: white; }
        .btn-clear { background: #21262d; color: #c9d1d9; border: 1px solid var(--border-color); }

        .table-container {
            overflow-x: auto;
            background: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-height: 70vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.8rem;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            white-space: nowrap;
        }
        th {
            background: #21262d;
            color: #58a6ff;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .week-row th {
            top: 27px;
            background: #1f242c;
            color: #58a6ff;
            font-weight: bold;
            font-size: 0.8rem;
            border-bottom: 2px solid #58a6ff;
        }
        .name-col {
            text-align: left;
            font-weight: bold;
            position: sticky;
            left: 0;
            background: #161b22;
            z-index: 3;
            min-width: 130px;
        }
        th.name-col { z-index: 4; }

        .week-separator {
            border-right: 2px solid #58a6ff !important;
        }

        td.cell-default {
            background-color: #f0f3f6;
            color: #24292e;
            cursor: pointer;
        }

        .pos-np { background-color: #238636 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-ep { background-color: #da3633 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-nep { background-color: #8957e5 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-szb { background-color: #9e6a03 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-szab { background-color: #1f6feb !important; color: white !important; font-weight: bold; cursor: pointer; }
        
        td.selected-cell {
            outline: 3px solid #ff7b72;
            outline-offset: -3px;
        }

        .legend {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            align-items: center;
            justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; }
    </style>
</head>
<body>

    <h1>Mátrix Labor — Vezénylési Rendszer</h1>
    <div class="subtitle">Pontosított Dátum-alapú Átvezetés + Látható Hetek</div>

    <div class="controls">
        <div>
            <label for="yearSelect">Év:</label>
            <select id="yearSelect" onchange="generateCalendar()">
                <script>
                    for(let y = 2026; y <= 2035; y++) {
                        document.write(`<option value="${y}" ${y === 2027 ? 'selected' : ''}>${y}</option>`);
                    }
                </script>
            </select>
        </div>
        <div>
            <label for="monthSelect">Hónap:</label>
            <select id="monthSelect" onchange="generateCalendar()">
                <option value="0">Január</option>
                <option value="1">Február</option>
                <option value="2">Március</option>
                <option value="3">Április</option>
                <option value="4">Május</option>
                <option value="5">Június</option>
                <option value="6">Július</option>
                <option value="7">Augusztus</option>
                <option value="8">Szeptember</option>
                <option value="9">Október</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
        </div>
        <button onclick="manualSave()">Adatok Mentése</button>
    </div>

    <div class="palette">
        <span>Kijelölt cella kitöltése:</span>
        <button class="p-btn btn-np" onclick="applyService('Np1', 'pos-np', 'np')">Nappal (Np)</button>
        <button class="p-btn btn-ep" onclick="applyService('Ép1', 'pos-ep', 'ep')">Éjjel (Ép)</button>
        <button class="p-btn btn-nep" onclick="applyService('NÉp1', 'pos-nep', 'nep')">24h (NÉp)</button>
        <button class="p-btn btn-szb" onclick="applyService('SZB', 'pos-szb', 'szb')">Szabadság (SZB)</button>
        <button class="p-btn btn-szab" onclick="applyService('SZ', 'pos-szab', 'szab')">Szabadnap (SZ)</button>
        <button class="p-btn btn-clear" onclick="applyService('', 'cell-default', 'clear')">Törlés</button>
    </div>

    <div class="table-container">
        <table id="scheduleTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background: var(--green);"></div> Nappal (Np 1-10) [12h]</div>
        <div class="legend-item"><div class="color-box" style="background: var(--red);"></div> Éjjel (Ép 1-10) [12h]</div>
        <div class="legend-item"><div class="color-box" style="background: var(--purple);"></div> 24h Szolgálat (NÉp 1-10) [24h]</div>
        <div class="legend-item"><div class="color-box" style="background: var(--yellow);"></div> Szabadság (SZB) [12h]</div>
        <div class="legend-item"><div class="color-box" style="background: var(--blue);"></div> Szabadnap (SZ)</div>
    </div>

    <script>
        const guards = [
            "Marácz Judit", "Csonka Norbert", "Gergely Richárd", "Horváth Csaba", "Páva Dávid",
            "Szabó Gábor", "Varga Dávid", "Vigh Szabina", "Cziemler Márk", "Németh Andor",
            "", "", "", "", "", "", "", "", "", ""
        ];

        const dayNames = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];
        let activeCell = null;

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return weekNo;
        }

        // Segédfüggvény dátum ISO kulcshoz (YYYY-MM-DD)
        function getDateKey(d) {
            let y = d.getFullYear();
            let m = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function generateCalendar() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);

            let days = [];
            
            // 1. Előző hónap utolsó 3 napja
            let pYear = year;
            let pMonth = month - 1;
            if(pMonth < 0) {
                pMonth = 11;
                pYear = year - 1;
            }
            let prevMonthLastDate = new Date(pYear, pMonth + 1, 0).getDate();

            for(let i = 2; i >= 0; i--) {
                let dayNum = prevMonthLastDate - i;
                let d = new Date(pYear, pMonth, dayNum);
                days.push({ date: d, isExtra: true });
            }

            // 2. Aktuális hónap napjai
            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                let d = new Date(year, month, i);
                days.push({ date: d, isExtra: false });
            }

            let weekRowHtml = '<tr class="week-row"><th class="name-col">Hét száma</th>';
            let dayRowHtml = '<tr><th class="name-col">Név / Dátum</th>';

            let prevWeek = -1;

            days.forEach((item, index) => {
                let d = item.date;
                let dayLetter = dayNames[d.getDay()];
                let weekNum = getWeekNumber(d);
                let dateStr = `${d.getMonth()+1}.${d.getDate()}.`;
                
                let isNewWeek = (weekNum !== prevWeek && index > 0);
                let sepClass = isNewWeek ? 'week-separator' : '';
                prevWeek = weekNum;

                weekRowHtml += `<th class="${sepClass}">${weekNum}.hét</th>`;
                dayRowHtml += `<th class="${sepClass}" style="${item.isExtra ? 'background:#1f2937;' : ''}">${dateStr}<br><small>${dayLetter}</small></th>`;
            });

            weekRowHtml += '<th>Össz. Óra</th></tr>';
            dayRowHtml += '<th>Órakeret</th></tr>';

            document.getElementById('tableHeader').innerHTML = weekRowHtml + dayRowHtml;

            // Adatok betöltése a LocalStorage-ból az összes hónapra vonatkozóan
            let savedData = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${month}`)) || {};

            let tbodyHtml = '';
            guards.forEach((guardName, gIndex) => {
                tbodyHtml += `<tr>`;
                tbodyHtml += `<td class="name-col"><input type="text" value="${guardName}" placeholder="Őr neve ${gIndex+1}" style="width:115px; background:transparent; border:none; color:inherit; font-weight:bold;"></td>`;
                
                days.forEach((item, dIndex) => {
                    let dKey = getDateKey(item.date);
                    let cellKey = `g_${gIndex}_d_${dIndex}`;
                    
                    let cellInfo = null;

                    // Ha extra (átvezető) nap, kikeressük az illető hónap adataiból a dátum alapján
                    if (item.isExtra) {
                        let eYear = item.date.getFullYear();
                        let eMonth = item.date.getMonth();
                        let eMonthData = JSON.parse(localStorage.getItem(`matrix_schedule_${eYear}_${eMonth}`)) || {};
                        // Megkeressük az adott hónap napjai között azt, amelyiknek ez a dátuma
                        let eDaysCount = new Date(eYear, eMonth + 1, 0).getDate();
                        let eStartDay = eDaysCount - 2; // utolsó 3 nap
                        for(let ed = 0; ed < 3; ed++) {
                            let testDate = new Date(eYear, eMonth, eStartDay + ed);
                            if(getDateKey(testDate) === dKey) {
                                // Megvan melyik nap index volt az előző hónapban
                                let originalDayIndex = (eDaysCount - 3) + ed;
                                cellInfo = eMonthData[`g_${gIndex}_d_${originalDayIndex}`];
                                break;
                            }
                        }
                    } else {
                        cellInfo = savedData[cellKey];
                    }

                    if (!cellInfo) {
                        cellInfo = { text: '', className: 'cell-default', type: 'empty' };
                    }
                    
                    let prevWeekCheck = (dIndex > 0 && getWeekNumber(days[dIndex].date) !== getWeekNumber(days[dIndex-1].date)) ? 'week-separator' : '';
                    tbodyHtml += `<td class="${cellInfo.className} ${prevWeekCheck}" onclick="selectCell(this)" data-type="${cellInfo.type}" data-key="${cellKey}">${cellInfo.text}</td>`;
                });

                tbodyHtml += `<td id="total-hours-${gIndex}" style="font-weight: bold; color: #58a6ff;">0h</td>`;
                tbodyHtml += `</tr>`;
            });

            document.getElementById('tableBody').innerHTML = tbodyHtml;

            document.querySelectorAll('#scheduleTable tbody tr').forEach(row => {
                calculateRowHours(row);
            });
        }

        function selectCell(cell) {
            if(activeCell) activeCell.classList.remove('selected-cell');
            activeCell = cell;
            activeCell.classList.add('selected-cell');
        }

        function applyService(text, className, type) {
            if(!activeCell) {
                alert('⚠️ Először kattints rá egy cellára a táblázatban, ahová be szeretnéd illeszteni a szolgálatot!');
                return;
            }

            let prevCell = activeCell.previousElementSibling;
            if(type === 'np' && prevCell && prevCell.dataset && prevCell.dataset.type === 'ep') {
                alert('⚠️ MÁTRIX LABOR BIZTONSÁGI FIGYELMEZTETÉS!\n\nNem lehet Nappalos (Np) poszt közvetlenül Éjjeles (Ép) után! Pihenőidő kötelező!');
                return;
            }

            let hasSeparator = activeCell.classList.contains('week-separator') ? 'week-separator' : '';
            activeCell.className = className + ' ' + hasSeparator + ' selected-cell';
            activeCell.innerText = text;
            activeCell.dataset.type = type;

            calculateRowHours(activeCell.closest('tr'));
            autoSave();
        }

        function calculateRowHours(row) {
            let cells = row.querySelectorAll('td');
            let totalHours = 0;

            for(let i = 1; i < cells.length - 1; i++) {
                let type = cells[i].dataset.type;
                if(type === 'np' || type === 'ep' || type === 'szb') {
                    totalHours += 12;
                } else if(type === 'nep') {
                    totalHours += 24;
                }
            }

            let hoursCell = cells[cells.length - 1];
            hoursCell.innerHTML = `<b>${totalHours}h</b>`;
        }

        function autoSave() {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            let dataToSave = {};

            document.querySelectorAll('#scheduleTable tbody tr').forEach((row, gIndex) => {
                row.querySelectorAll('td').forEach((cell, cIndex) => {
                    if(cIndex > 0 && cIndex < row.querySelectorAll('td').length - 1) {
                        let cellKey = cell.dataset.key;
                        if(cellKey) {
                            dataToSave[cellKey] = {
                                text: cell.innerText,
                                className: cell.className.replace('selected-cell', '').trim(),
                                type: cell.dataset.type
                            };
                        }
                    }
                });
            });

            localStorage.setItem(`matrix_schedule_${year}_${month}`, JSON.stringify(dataToSave));
        }

        function manualSave() {
            autoSave();
            alert('💾 A Mátrix Labor adatai sikeresen mentve a böngészőbe!');
        }

        window.onload = generateCalendar;
    </script>
</body>
</html>
