<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mátrix Labor — Vezénylési Rendszer & Göngyölített Szabi</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --green: #238636;
            --red: #da3633;
            --orange: #d29922;
            --purple: #8957e5;
            --yellow: #9e6a03;
            --blue: #1f6feb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 2px;
            font-size: 1.1rem;
        }
        .subtitle {
            text-align: center;
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        select, input, button {
            background: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 6px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
        button {
            background: var(--blue);
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #388bfd; }

        .palette {
            display: flex;
            gap: 5px;
            background: var(--panel-bg);
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        .palette span { font-weight: bold; color: #8b949e; margin-right: 4px; }
        .p-btn { padding: 3px 6px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .btn-np { background: var(--green); color: white; }
        .btn-ep { background: var(--red); color: white; }
        .btn-nep { background: var(--purple); color: white; }
        .btn-szb { background: var(--yellow); color: white; }
        .btn-szab { background: var(--blue); color: white; }
        .btn-clear { background: #21262d; color: #c9d1d9; border: 1px solid var(--border-color); }

        .table-container {
            overflow: auto;
            background: var(--panel-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-height: 50vh;
            margin-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.7rem;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 3px 2px;
            white-space: nowrap;
        }
        
        th {
            position: sticky;
            z-index: 2;
        }
        .week-row th {
            top: 0;
            background-color: #1f242c !important;
            color: #58a6ff;
            font-weight: bold;
            z-index: 4;
        }
        .req-row th {
            top: 21px;
            background-color: #161b22 !important;
            z-index: 4;
        }
        .day-row th {
            top: 42px;
            background-color: #21262d !important;
            color: #58a6ff;
            z-index: 4;
        }
        .name-col {
            text-align: left;
            font-weight: bold;
            position: sticky;
            left: 0;
            background-color: #161b22 !important;
            z-index: 3;
            min-width: 110px;
            font-size: 0.75rem;
        }
        th.name-col {
            background-color: #21262d !important;
            z-index: 5 !important;
        }

        .week-separator {
            border-right: 2px solid #58a6ff !important;
        }

        td.cell-default {
            background-color: #f0f3f6;
            color: #24292e;
            cursor: pointer;
            min-width: 26px;
        }

        .pos-np { background-color: #238636 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-ep { background-color: #da3633 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-nep { background-color: #8957e5 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-szb { background-color: #9e6a03 !important; color: white !important; font-weight: bold; cursor: pointer; }
        .pos-szab { background-color: #1f6feb !important; color: white !important; font-weight: bold; cursor: pointer; }
        
        td.selected-cell {
            outline: 2px solid #ff7b72;
            outline-offset: -2px;
        }

        /* Alsó panelek */
        .panels-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 900px) {
            .panels-wrapper { grid-template-columns: 1fr; }
        }
        .audit-panel, .vacation-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.8rem;
        }
        .audit-panel h3, .vacation-panel h3 {
            margin-top: 0;
            color: #58a6ff;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .alert-badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.65rem;
        }
        .alert-ok { background: var(--green); color: white; }
        .alert-error { background: var(--red); color: white; }
        .alert-warning { background: var(--orange); color: white; }

        /* VILOGÓ LED ANIMÁCIÓ HIÁNY VAGY TÖBBLET ESETÉN */
        @keyframes blinkLed {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }
        .led-alert {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--red);
            border-radius: 50%;
            margin-left: 3px;
            animation: blinkLed 0.8s infinite;
            box-shadow: 0 0 5px var(--red);
        }
        .led-warning {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--orange);
            border-radius: 50%;
            margin-left: 3px;
            animation: blinkLed 0.8s infinite;
            box-shadow: 0 0 5px var(--orange);
        }

        .day-saturday {
            background-color: #1b4b2c !important;
            color: #3fb950 !important;
            border-bottom: 2px solid var(--green) !important;
        }
        .day-sunday-holiday {
            background-color: #512022 !important;
            color: #ff7b72 !important;
            border-bottom: 2px solid var(--red) !important;
        }
    </style>
</head>
<body>

    <h1>Mátrix Labor — Vezénylési Rendszer</h1>
    <div class="subtitle">Göngyölített Szabadságkövető & Villogó LED Létszámfigyelő</div>

    <div class="controls">
        <div>
            <label for="yearSelect">Év:</label>
            <select id="yearSelect" onchange="generateCalendar()">
                <script>
                    for(let y = 2026; y <= 2035; y++) {
                        document.write(`<option value="${y}" ${y === 2027 ? 'selected' : ''}>${y}</option>`);
                    }
                </script>
            </select>
        </div>
        <div>
            <label for="monthSelect">Hónap:</label>
            <select id="monthSelect" onchange="generateCalendar()">
                <option value="0">Január</option>
                <option value="1">Február</option>
                <option value="2">Március</option>
                <option value="3">Április</option>
                <option value="4">Május</option>
                <option value="5">Június</option>
                <option value="6">Július</option>
                <option value="7">Augusztus</option>
                <option value="8">Szeptember</option>
                <option value="9">Október</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
        </div>
        <button onclick="manualSave()">Adatok Mentése</button>
    </div>

    <div class="palette">
        <span>Gyorskitöltés:</span>
        <button class="p-btn btn-np" onclick="applyServiceWithPos('Np', 'pos-np', 'np')">Nappal:</button>
        <select id="npNum" style="padding: 1px 3px; font-size:0.7rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>

        <button class="p-btn btn-ep" onclick="applyServiceWithPos('Ép', 'pos-ep', 'ep')">Éjjel:</button>
        <select id="epNum" style="padding: 1px 3px; font-size:0.7rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>

        <button class="p-btn btn-nep" onclick="applyServiceWithPos('NÉp', 'pos-nep', 'nep')">24h:</button>
        <select id="nepNum" style="padding: 1px 3px; font-size:0.7rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>

        <button class="p-btn btn-szb" onclick="applyService('SZB', 'pos-szb', 'szb')">Szabadság (SZB)</button>
        <button class="p-btn btn-szab" onclick="applyService('SZ', 'pos-szab', 'szab')">Szabadnap (SZ)</button>
        <button class="p-btn btn-clear" onclick="applyService('', 'cell-default', 'clear')">Törlés</button>
    </div>

    <div class="table-container">
        <table id="scheduleTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Alsó Panelek -->
    <div class="panels-wrapper">
        <div class="audit-panel">
            <h3>🔍 Létszám Figyelőmotor (LED-es jelzéssel)</h3>
            <div id="auditReport" style="font-size:0.75rem;">Elemzés...</div>
        </div>
        <div class="vacation-panel">
            <h3>🌴 Éves Göngyölített Szabadságkezelő</h3>
            <div id="vacationReport" style="font-size:0.75rem;">Szabadságok számítása...</div>
        </div>
    </div>

    <script>
        const guards = [
            "Marácz Judit", "Csonka Norbert", "Gergely Richárd", "Horváth Csaba", "Páva Dávid",
            "Szabó Gábor", "Varga Dávid", "Vigh Szabina", "Cziemler Márk", "Németh Andor",
            "", "", "", "", "", "", "", "", "", ""
        ];

        const dayNames = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];
        let activeCell = null;

        function isHoliday(date) {
            let m = date.getMonth() + 1;
            let d = date.getDate();
            const fixedHolidays = [
                "1-1", "3-15", "5-1", "8-20", "10-23", "11-1", "12-25", "12-26"
            ];
            return fixedHolidays.includes(`${m}-${d}`);
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return weekNo;
        }

        function getDateKey(d) {
            let y = d.getFullYear();
            let m = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function generateCalendar() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);

            let days = [];
            let pYear = year;
            let pMonth = month - 1;
            if(pMonth < 0) {
                pMonth = 11;
                pYear = year - 1;
            }
            let prevMonthLastDate = new Date(pYear, pMonth + 1, 0).getDate();

            for(let i = 2; i >= 0; i--) {
                let dayNum = prevMonthLastDate - i;
                let d = new Date(pYear, pMonth, dayNum);
                days.push({ date: d, isExtra: true });
            }

            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                let d = new Date(year, month, i);
                days.push({ date: d, isExtra: false });
            }

            let weekRowHtml = '<tr class="week-row"><th class="name-col">Hét száma</th>';
            let reqRowHtml = '<tr class="req-row"><th class="name-col">Elvárt Létszám</th>';
            let dayRowHtml = '<tr class="day-row"><th class="name-col">Név / Dátum</th>';

            let prevWeek = -1;
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};

            days.forEach((item, index) => {
                let d = item.date;
                let dayIndex = d.getDay();
                let dayLetter = dayNames[dayIndex];
                let weekNum = getWeekNumber(d);
                let dateStr = `${d.getMonth()+1}.${d.getDate()}.`;
                let dKey = getDateKey(d);
                
                let isNewWeek = (weekNum !== prevWeek && index > 0);
                let sepClass = isNewWeek ? 'week-separator' : '';
                prevWeek = weekNum;

                weekRowHtml += `<th class="${sepClass}">${weekNum}.hét</th>`;
                
                let reqVal = savedRequired[dKey] !== undefined ? savedRequired[dKey] : 2;
                reqRowHtml += `<th class="${sepClass}"><input type="number" min="0" max="20" value="${reqVal}" data-date="${dKey}" onchange="updateRequired(this)" style="width:24px; text-align:center; background:#161b22; color:#58a6ff; border:1px solid var(--border-color); border-radius:3px; font-weight:bold; font-size:0.7rem;"></th>`;

                let dayClass = "";
                if (dayIndex === 6) {
                    dayClass = "day-saturday";
                } else if (dayIndex === 0 || isHoliday(d)) {
                    dayClass = "day-sunday-holiday";
                }

                // Itt helyezzük el a villogó LED-et a fejlécbe, ha eltérés van!
                dayRowHtml += `<th id="th-day-${dKey}" class="${sepClass} ${dayClass}" style="${item.isExtra ? 'opacity:0.6;' : ''}">${dateStr}<br><small>${dayLetter}</small><span id="led-${dKey}"></span></th>`;
            });

            weekRowHtml += '<th class="name-col">Óra</th></tr>';
            reqRowHtml += '<th class="name-col">Cél</th></tr>';
            dayRowHtml += '<th class="name-col">Keret</th></tr>';

            document.getElementById('tableHeader').innerHTML = weekRowHtml + reqRowHtml + dayRowHtml;

            let savedData = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${month}`)) || {};

            let tbodyHtml = '';
            guards.forEach((guardName, gIndex) => {
                if(!guardName) return;
                tbodyHtml += `<tr>`;
                tbodyHtml += `<td class="name-col"><input type="text" value="${guardName}" placeholder="Őr ${gIndex+1}" style="width:100px; background:transparent; border:none; color:inherit; font-weight:bold; font-size:0.75rem;" oninput="autoSave()"></td>`;
                
                days.forEach((item, dIndex) => {
                    let dKey = getDateKey(item.date);
                    let cellKey = `g_${gIndex}_d_${dIndex}`;
                    let globalKey = `global_cell_${dKey}_g_${gIndex}`;
                    
                    let cellInfo = JSON.parse(localStorage.getItem(globalKey)) || savedData[cellKey];
                    if (!cellInfo) {
                        cellInfo = { text: '', className: 'cell-default', type: 'empty' };
                    }
                    
                    let prevWeekCheck = (dIndex > 0 && getWeekNumber(days[dIndex].date) !== getWeekNumber(days[dIndex-1].date)) ? 'week-separator' : '';
                    tbodyHtml += `<td class="${cellInfo.className} ${prevWeekCheck}" onclick="selectCell(this)" data-type="${cellInfo.type}" data-key="${cellKey}" data-date="${dKey}" data-guard="${gIndex}">${cellInfo.text}</td>`;
                });

                tbodyHtml += `<td id="total-hours-${gIndex}" style="font-weight: bold; color: #58a6ff;">0h</td>`;
                tbodyHtml += `</tr>`;
            });

            document.getElementById('tableBody').innerHTML = tbodyHtml;

            document.querySelectorAll('#scheduleTable tbody tr').forEach(row => {
                calculateRowHours(row);
            });

            runAuditEngine(days, year, month);
            runVacationEngine(year, month);
        }

        function updateRequired(input) {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            let dKey = input.dataset.date;
            
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            savedRequired[dKey] = parseInt(input.value) || 0;
            localStorage.setItem(`matrix_required_${year}_${month}`, JSON.stringify(savedRequired));

            generateCalendar();
        }

        function selectCell(cell) {
            if(activeCell) activeCell.classList.remove('selected-cell');
            activeCell = cell;
            activeCell.classList.add('selected-cell');
        }

        function applyServiceWithPos(prefix, className, type) {
            let numId = type === 'np' ? 'npNum' : (type === 'ep' ? 'epNum' : 'nepNum');
            let numVal = document.getElementById(numId).value;
            applyService(prefix + numVal, className, type);
        }

        function applyService(text, className, type) {
            if(!activeCell) {
                alert('⚠️ Először kattints rá egy cellára a táblázatban!');
                return;
            }

            let prevCell = activeCell.previousElementSibling;
            if(type === 'np' && prevCell && prevCell.dataset && prevCell.dataset.type === 'ep') {
                alert('⚠️ Biztonsági figyelmeztetés: Nappal nem lehet közvetlenül Éjjel után!');
                return;
            }

            let hasSeparator = activeCell.classList.contains('week-separator') ? 'week-separator' : '';
            activeCell.className = className + ' ' + hasSeparator + ' selected-cell';
            activeCell.innerText = text;
            activeCell.dataset.type = type;

            let dKey = activeCell.dataset.date;
            let gIndex = activeCell.dataset.guard;
            let cellDataToSave = { text: text, className: className, type: type };
            localStorage.setItem(`global_cell_${dKey}_g_${gIndex}`, JSON.stringify(cellDataToSave));

            calculateRowHours(activeCell.closest('tr'));
            autoSave();
            
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            let days = [];
            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                days.push({ date: new Date(year, month, i) });
            }
            runAuditEngine(days, year, month);
            runVacationEngine(year, month);
        }

        function calculateRowHours(row) {
            let cells = row.querySelectorAll('td');
            let totalHours = 0;

            for(let i = 1; i < cells.length - 1; i++) {
                let type = cells[i].dataset.type;
                if(type === 'np' || type === 'ep' || type === 'szb') {
                    totalHours += 12;
                } else if(type === 'nep') {
                    totalHours += 24;
                }
            }

            let hoursCell = cells[cells.length - 1];
            hoursCell.innerHTML = `<b>${totalHours}h</b>`;
        }

        // --- GÖNGYÖLÍTETT SZABADSÁG MOTOR (Januártól a tárgyhónapig összesítve) ---
        function runVacationEngine(year, month) {
            let reportHtml = `<table style="width:100%; font-size:0.7rem;"><tr><th>Őr neve</th><th>Alap Keret</th><th>Eddig Felhasznált</th><th>Aktuális Maradék</th></tr>`;
            
            guards.forEach((guardName, gIndex) => {
                if(!guardName) return;
                
                let baseKey = `vacation_base_${gIndex}`;
                let baseVal = parseInt(localStorage.getItem(baseKey)) || 30;

                // Januártól a kiválasztott hónapig (m) összesítjük az összes felhasznált SZB-t
                let totalUsedUntilNow = 0;
                for(let m = 0; m <= month; m++) {
                    let mDays = new Date(year, m + 1, 0).getDate();
                    let mSavedSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${m}`)) || {};
                    
                    for(let d = 0; d < mDays; d++) {
                        let cellKey = `g_${gIndex}_d_${d}`; // Figyelem az extra napok eltolására a globális tárolóból is lekérdezve:
                        let dObj = new Date(year, m, d + 1);
                        let dKey = getDateKey(dObj);
                        let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`)) || mSavedSchedule[cellKey];
                        
                        if(globalData && globalData.type === 'szb') {
                            totalUsedUntilNow++;
                        }
                    }
                }

                let remaining = baseVal - totalUsedUntilNow;

                reportHtml += `<tr>
                    <td><b>${guardName}</b></td>
                    <td>${baseVal} nap</td>
                    <td style="color:var(--yellow);">${totalUsedUntilNow} nap</td>
                    <td style="color:var(--blue); font-weight:bold;">${remaining} nap</td>
                </tr>`;
            });
            reportHtml += `</table>`;
            document.getElementById('vacationReport').innerHTML = reportHtml;
        }

        function runAuditEngine(days, year, month) {
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            let issues = [];

            days.forEach(item => {
                let dKey = getDateKey(item.date);
                let requiredCount = savedRequired[dKey] !== undefined ? savedRequired[dKey] : 2;
                
                let actualCount = 0;
                guards.forEach((_, gIndex) => {
                    if(!guards[gIndex]) return;
                    let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`));
                    if (globalData && globalData.type && globalData.type !== 'empty' && globalData.type !== 'szab') {
                        actualCount++;
                    }
                });

                let ledSpan = document.getElementById(`led-${dKey}`);
                if (ledSpan) ledSpan.innerHTML = '';

                if (actualCount < requiredCount) {
                    if (ledSpan) ledSpan.innerHTML = `<span class="led-alert" title="Hiány: ${actualCount}/${requiredCount}"></span>`;
                    issues.push({ date: `${item.date.getMonth()+1}.${item.date.getDate()}.`, type: 'hiány', diff: requiredCount - actualCount, req: requiredCount, act: actualCount });
                } else if (actualCount > requiredCount) {
                    if (ledSpan) ledSpan.innerHTML = `<span class="led-warning" title="Többlet: ${actualCount}/${requiredCount}"></span>`;
                    issues.push({ date: `${item.date.getMonth()+1}.${item.date.getDate()}.`, type: 'többlet', diff: actualCount - requiredCount, req: requiredCount, act: actualCount });
                }
            });

            let reportHtml = '';
            if (issues.length === 0) {
                reportHtml = `<span class="alert-badge alert-ok">MINDEN PONTOS</span> A létszám keret tökéletesen teljesül!`;
            } else {
                let deficits = issues.filter(i => i.type === 'hiány');
                let surpluses = issues.filter(i => i.type === 'többlet');
                reportHtml = `<span class="alert-badge alert-error">${deficits.length} hiány (villogó piros LED)</span> | <span class="alert-badge alert-warning">${surpluses.length} többlet (villogó narancs LED)</span>`;
            }

            document.getElementById('auditReport').innerHTML = reportHtml;
        }

        function autoSave() {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            let dataToSave = {};

            document.querySelectorAll('#scheduleTable tbody tr').forEach((row, gIndex) => {
                row.querySelectorAll('td').forEach((cell, cIndex) => {
                    if(cIndex > 0 && cIndex < row.querySelectorAll('td').length - 1) {
                        let cellKey = cell.dataset.key;
                        let dKey = cell.dataset.date;
                        if(cellKey) {
                            let cellInfo = {
                                text: cell.innerText,
                                className: cell.className.replace('selected-cell', '').trim(),
                                type: cell.type || cell.dataset.type
                            };
                            dataToSave[cellKey] = cellInfo;
                            if(dKey) {
                                localStorage.setItem(`global_cell_${dKey}_g_${gIndex}`, JSON.stringify(cellInfo));
                            }
                        }
                    }
                });
            });

            localStorage.setItem(`matrix_schedule_${year}_${month}`, JSON.stringify(dataToSave));
        }

        function manualSave() {
            autoSave();
            alert('💾 A Mátrix Labor adatai, a göngyölített szabik és a LED állapotok mentve!');
        }

        window.onload = generateCalendar;
    </script>
</body>
</html>
