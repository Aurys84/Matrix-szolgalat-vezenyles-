<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mátrix Labor — Vezénylési Rendszer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #161b22;
            --panel-bg: #21262d;
            --text-color: #f0f6fc;
            --border-color: #30363d;
            --green: #238636;
            --red: #da3633;
            --yellow-led: #ffd700;
            --purple: #8957e5;
            --yellow: #9e6a03;
            --blue: #1f6feb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        select, input, button {
            background: #30363d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
        button {
            background: var(--blue);
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #388bfd; }
        .btn-save {
            background: var(--green) !important;
            color: white !important;
        }
        .btn-save:hover { background: #2ea043 !important; }
        .btn-print {
            background: #1f6feb !important;
            color: white !important;
        }
        .btn-print:hover { background: #388bfd !important; }
        .btn-pdf {
            background: #8957e5 !important;
            color: white !important;
        }
        .btn-pdf:hover { background: #9c6ffe !important; }
        .palette {
            display: flex;
            gap: 5px;
            background: var(--panel-bg);
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        .palette span { font-weight: bold; color: #8b949e; margin-right: 4px; }
        .p-btn { padding: 3px 6px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .btn-np { background: var(--green); color: white; }
        .btn-ep { background: var(--red); color: white; }
        .btn-nep { background: var(--purple); color: white; }
        .btn-szb { background: var(--yellow); color: white; }
        .btn-szab { background: var(--blue); color: white; }
        .btn-clear { background: #30363d; color: #c9d1d9; border: 1px solid var(--border-color); }
        .table-container {
            overflow: auto;
            background: var(--panel-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-height: 55vh;
            margin-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            position: sticky;
            z-index: 2;
            font-weight: 900;
        }
        .week-row th {
            top: 0;
            background-color: #21262d !important;
            color: #58a6ff;
            z-index: 4;
        }
        .req-row th {
            top: 28px;
            background-color: #161b22 !important;
            z-index: 4;
        }
        .day-row th {
            top: 56px;
            z-index: 4;
        }
        
        .name-col {
            text-align: left;
            font-weight: 900;
            position: sticky;
            left: 0;
            background-color: #21262d !important;
            z-index: 3;
            width: 160px;
            min-width: 160px;
            max-width: 160px;
            padding: 4px 8px !important;
            vertical-align: middle;
            height: 46px;
        }
        .guard-name-input {
            width: 145px;
            background: transparent;
            border: none;
            color: inherit;
            font-weight: 900;
            font-size: 0.85rem;
            resize: none;
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.2;
            font-family: inherit;
            display: block;
            height: 38px;
        }
        th.name-col {
            background-color: #30363d !important;
            z-index: 5 !important;
            white-space: nowrap !important;
            height: auto !important;
            width: 160px !important;
            min-width: 160px !important;
        }
        
        #scheduleTable th:last-child,
        #scheduleTable td:last-child {
            width: 55px;
            min-width: 55px;
            max-width: 55px;
            font-size: 0.95rem !important;
            font-weight: 900 !important;
            color: #58a6ff !important;
        }

        .total-row td {
            background-color: #1f2937 !important;
            color: #58a6ff !important;
            font-weight: 900 !important;
            font-size: 0.95rem !important;
            height: auto !important;
        }
        .week-separator {
            border-left: 2px solid #58a6ff !important;
        }
        
        td.cell-default, td[class*="pos-"] {
            font-size: 0.95rem !important;
            font-weight: 900 !important;
        }
        td.cell-default {
            background-color: #ffffff;
            color: #24292e;
            cursor: pointer;
        }
        td.cell-locked {
            background-color: #1f6feb !important;
            color: white !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
            font-weight: 900 !important;
        }
        .pos-np { background-color: #238636 !important; color: white !important; cursor: pointer; }
        .pos-ep { background-color: #da3633 !important; color: white !important; cursor: pointer; }
        .pos-nep { background-color: #8957e5 !important; color: white !important; cursor: pointer; }
        .pos-szb { background-color: #9e6a03 !important; color: white !important; cursor: pointer; }
        .pos-szab { background-color: #1f6feb !important; color: white !important; cursor: pointer; }
        
        td.selected-cell {
            outline: 2px solid #ff7b72;
            outline-offset: -2px;
        }
        .panels-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .top-panels-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        @media (max-width: 900px) {
            .top-panels-row { grid-template-columns: 1fr; }
        }
        .audit-panel, .holiday-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.8rem;
        }
        .vacation-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.8rem;
            width: 100%;
            box-sizing: border-box;
        }
        .vacation-panel h3 {
            margin-top: 0;
            color: #58a6ff;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .vacation-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        @media (max-width: 1200px) {
            .vacation-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 800px) {
            .vacation-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .vacation-card {
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 6px 8px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .vacation-card-header {
            font-weight: bold;
            color: #f0f6fc;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vacation-card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b949e;
            font-size: 0.7rem;
        }
        .alert-badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.65rem;
        }
        .alert-ok { background: var(--green); color: white; }
        .alert-error { background: var(--red); color: white; }
        .alert-warning { background: var(--yellow-led); color: #000; }
        
        @keyframes blinkLed {
            0% { opacity: 1; transform: scale(1); filter: brightness(1); }
            50% { opacity: 0.15; transform: scale(1.5); filter: brightness(2); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        }
        .led-ok {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2ea043;
            border-radius: 50%;
            margin-left: 3px;
            box-shadow: 0 0 6px #2ea043;
        }
        .led-alert {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-left: 3px;
            animation: blinkLed 0.5s infinite;
            box-shadow: 0 0 10px #ff3b30;
        }
        .led-warning {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ffd700;
            border-radius: 50%;
            margin-left: 3px;
            animation: blinkLed 0.5s infinite;
            box-shadow: 0 0 10px #ffd700;
        }
        .day-saturday-header {
            background-color: #1f4f29 !important;
            color: #56d364 !important;
            border-bottom: 2px solid var(--green) !important;
        }
        .day-sunday-holiday-header {
            background-color: #672528 !important;
            color: #ff8182 !important;
            border-bottom: 2px solid var(--red) !important;
        }
        .day-normal-header {
            background-color: #30363d !important;
            color: #f0f6fc !important;
        }

        @media print {
            .controls, .palette, .panels-wrapper { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
        }
    </style>
</head>
<body id="mainBody">
    <h1>Mátrix Labor — Vezénylési Rendszer</h1>
    <div class="controls">
        <div style="display: flex; gap: 8px; align-items: center;">
            <div>
                <label for="yearSelect">Év:</label>
                <select id="yearSelect" onchange="generateCalendar()">
                    <script>
                        for(let y = 2026; y <= 2035; y++) {
                            document.write(`<option value="${y}" ${y === 2027 ? 'selected' : ''}>${y}</option>`);
                        }
                    </script>
                </select>
            </div>
            <div>
                <label for="monthSelect">Hónap:</label>
                <select id="monthSelect" onchange="generateCalendar()">
                    <option value="0">Január</option>
                    <option value="1">Február</option>
                    <option value="2">Március</option>
                    <option value="3">Április</option>
                    <option value="4">Május</option>
                    <option value="5">Június</option>
                    <option value="6">Július</option>
                    <option value="7">Augusztus</option>
                    <option value="8">Szeptember</option>
                    <option value="9">Október</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-save" onclick="manualSave()">💾 Adatok Mentése</button>
            <button class="btn-print" onclick="window.print()">🖨️ Nyomtatás</button>
            <button class="btn-pdf" onclick="exportDirectPdf()">📥 PDF Vezetőségi Jelentés</button>
        </div>
    </div>
    <div class="palette">
        <span>Gyorskitöltés:</span>
        <button class="p-btn btn-np" onclick="applyServiceWithPos('Np', 'pos-np', 'np')">Nappal:</button>
        <select id="npNum" style="padding: 1px 3px; font-size:0.7rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>
        <button class="p-btn btn-ep" onclick="applyServiceWithPos('Ép', 'pos-ep', 'ep')">Éjjel:</button>
        <select id="epNum" style="padding: 1px 3px; font-size:0.7rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>
        <button class="p-btn btn-nep" onclick="applyServiceWithPos('NÉp', 'pos-nep', 'nep')">24h:</button>
        <select id="nepNum" style="padding: 1px 3px; font-size:0.7rem;">
            <script>for(let i=1; i<=20; i++) document.write(`<option value="${i}">${i}</option>`);</script>
        </select>
        <button class="p-btn btn-szb" onclick="applyService('SZB', 'pos-szb', 'szb')">Szabadság (SZB)</button>
        <button class="p-btn btn-szab" onclick="applyService('SZ', 'pos-szab', 'szab')">Szabadnap (SZ)</button>
        <button class="p-btn btn-clear" onclick="applyService('', 'cell-default', 'clear')">Törlés</button>
    </div>
    <div class="table-container">
        <table id="scheduleTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="panels-wrapper">
        <div class="vacation-panel">
            <h3>🌴 Éves Göngyölített Szabadságkezelő (Alapkeretek szabadon szerkeszthetők)</h3>
            <div id="vacationReport" class="vacation-grid">Szabadságok számítása...</div>
        </div>
        <div class="top-panels-row">
            <div class="audit-panel">
                <h3>🔍 Létszám Figyelőmotor</h3>
                <div id="auditReport" style="font-size:0.75rem;">Elemzés...</div>
            </div>
            <div class="holiday-panel">
                <h3>🎉 Havi Ünnepnapok Számláló</h3>
                <div id="holidayReport" style="font-size:0.75rem;">Ünnepnapok ellenőrzése...</div>
            </div>
        </div>
    </div>

    <!-- Rejtett konténer a tiszta PDF exportért -->
    <div id="pdfExportContainer" style="display:none; background:#ffffff; color:#000000; padding:15px; width:1120px;"></div>

    <script>
        const defaultGuards = [
            "Marácz Judit", "Csonka Norbert", "Gergely Richárd", "Horváth Csaba", "Páva Dávid",
            "Szabó Gábor", "Varga Dávid", "Vigh Szabina", "Cziemler Márk", "Németh Andor",
            "Őr 11", "Őr 12", "Őr 13", "Őr 14", "Őr 15", "Őr 16", "Őr 17", "Őr 18", "Őr 19", "Őr 20"
        ];
        const dayNames = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];
        let activeCell = null;
        function isHoliday(date) {
            let m = date.getMonth() + 1;
            let d = date.getDate();
            const fixedHolidays = [
                "1-1", "3-15", "5-1", "8-20", "10-23", "11-1", "12-25", "12-26"
            ];
            return fixedHolidays.includes(`${m}-${d}`);
        }
        function getISOWeekNumber(d) {
            let date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            let dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            let yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }
        function getDateKey(d) {
            let y = d.getFullYear();
            let m = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }
        function generateCalendar() {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            if(!yearSelect || !monthSelect) return;
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            let days = [];
            let pYear = year;
            let pMonth = month - 1;
            if(pMonth < 0) {
                pMonth = 11;
                pYear = year - 1;
            }
            let prevMonthLastDate = new Date(pYear, pMonth + 1, 0).getDate();
            for(let i = 2; i >= 0; i--) {
                let dayNum = prevMonthLastDate - i;
                let d = new Date(pYear, pMonth, dayNum);
                days.push({ date: d, isExtra: true });
            }
            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                let d = new Date(year, month, i);
                days.push({ date: d, isExtra: false });
            }
            let weekRowHtml = '<tr class="week-row"><th class="name-col" style="white-space:nowrap !important;">Hét száma</th>';
            let reqRowHtml = '<tr class="req-row"><th class="name-col" style="white-space:nowrap !important;">Elvárt Létszám</th>';
            let dayRowHtml = '<tr class="day-row"><th class="name-col" style="white-space:nowrap !important;">Név / Dátum</th>';
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            let holidayCount = 0;
            days.forEach((item, index) => {
                let d = item.date;
                let dayIndex = d.getDay();
                let dayLetter = dayNames[dayIndex];
                let weekNum = getISOWeekNumber(d);
                let dateStr = `${d.getMonth()+1}.${d.getDate()}.`;
                let dKey = getDateKey(d);
                
                let isMonday = (dayIndex === 1);
                let sepClass = (isMonday && index > 0) ? 'week-separator' : '';
                weekRowHtml += `<th class="${sepClass}">${weekNum}.hét</th>`;
                
                if (item.isExtra) {
                    reqRowHtml += `<th class="${sepClass}" style="background:#1f6feb;">-</th>`;
                } else {
                    let reqVal = savedRequired[dKey] !== undefined ? savedRequired[dKey] : 2;
                    reqRowHtml += `<th class="${sepClass}"><input type="number" min="0" max="20" value="${reqVal}" data-date="${dKey}" onchange="updateRequired(this)" style="width:20px; text-align:center; background:#21262d; color:#58a6ff; border:1px solid var(--border-color); border-radius:3px; font-weight:bold; font-size:0.7rem;"></th>`;
                }
                let headerClass = "day-normal-header";
                if (isHoliday(d)) {
                    headerClass = "day-sunday-holiday-header";
                    if (!item.isExtra) holidayCount++;
                } else if (dayIndex === 6) {
                    headerClass = "day-saturday-header";
                } else if (dayIndex === 0) {
                    headerClass = "day-sunday-holiday-header";
                }
                let extraHeaderStyle = item.isExtra && headerClass === "day-normal-header" ? 'background:#1f6feb; color:white;' : '';
                let ledHtml = item.isExtra ? '' : `<span id="led-${dKey}"><span class="led-ok" title="Létszám rendben"></span></span>`;
                dayRowHtml += `<th id="th-day-${dKey}" class="${sepClass} ${headerClass}" style="${extraHeaderStyle}">${dateStr}<br><small style="font-size:0.6rem; font-weight:bold;">${dayLetter}</small>${ledHtml}</th>`;
            });
            weekRowHtml += '<th class="name-col" style="white-space:nowrap !important;">Óra</th></tr>';
            reqRowHtml += '<th class="name-col" style="white-space:nowrap !important;">Cél</th></tr>';
            dayRowHtml += '<th class="name-col" style="white-space:nowrap !important;">Keret</th></tr>';
            document.getElementById('tableHeader').innerHTML = weekRowHtml + reqRowHtml + dayRowHtml;
            document.getElementById('holidayReport').innerHTML = `<b>Ebben a hónapban:</b> <span style="color:#ff8182; font-weight:bold; font-size:0.85rem;">${holidayCount} db</span> hivatalos ünnepnap esik.`;
            let savedGuards = JSON.parse(localStorage.getItem(`matrix_guards_${year}_${month}`)) || defaultGuards;
            let prevMonthSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${pYear}_${pMonth}`)) || {};
            let savedData = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${month}`)) || {};
            let tbodyHtml = '';
            savedGuards.forEach((guardName, gIndex) => {
                tbodyHtml += `<tr>`;
                tbodyHtml += `<td class="name-col"><textarea id="guard-name-${gIndex}" class="guard-name-input" rows="2" placeholder="Őr ${gIndex+1}" oninput="autoSave()">${guardName}</textarea></td>`;
                
                days.forEach((item, dIndex) => {
                    let d = item.date;
                    let dayIndex = d.getDay();
                    let dKey = getDateKey(d);
                    let cellKey = `g_${gIndex}_d_${dIndex}`;
                    let globalKey = `global_cell_${dKey}_g_${gIndex}`;
                    
                    let cellInfo = null;
                    if (item.isExtra) {
                        let prevD = item.date;
                        let prevDKey = getDateKey(prevD);
                        let prevGlobalKey = `global_cell_${prevDKey}_g_${gIndex}`;
                        let prevCellData = JSON.parse(localStorage.getItem(prevGlobalKey));
                        if (prevCellData && prevCellData.text) {
                            cellInfo = { text: prevCellData.text, className: prevCellData.className, type: prevCellData.type };
                        } else {
                            let prevCellKey = `g_${gIndex}_d_${prevMonthLastDate - 3 + dIndex}`;
                            let oldData = prevMonthSchedule[prevCellKey];
                            if (oldData && oldData.text) {
                                cellInfo = { text: oldData.text, className: oldData.className, type: oldData.type };
                            } else {
                                cellInfo = { text: '', className: 'cell-locked', type: 'locked' };
                            }
                        }
                    } else {
                        cellInfo = JSON.parse(localStorage.getItem(globalKey)) || savedData[cellKey];
                        if (!cellInfo) {
                            cellInfo = { text: '', className: 'cell-default', type: 'empty' };
                        }
                    }
                    
                    let isMonday = (dayIndex === 1);
                    let prevWeekCheck = (isMonday && dIndex > 0) ? 'week-separator' : '';
                    
                    if (item.isExtra) {
                        tbodyHtml += `<td class="${cellInfo.className} ${prevWeekCheck}">${cellInfo.text || ''}</td>`;
                    } else {
                        tbodyHtml += `<td class="${cellInfo.className} ${prevWeekCheck}" onclick="selectCell(this)" data-type="${cellInfo.type}" data-key="${cellKey}" data-date="${dKey}" data-guard="${gIndex}">${cellInfo.text}</td>`;
                    }
                });
                tbodyHtml += `<td id="total-hours-${gIndex}" style="font-weight: 900; font-size: 0.95rem; color: #58a6ff; white-space:nowrap;">0h</td>`;
                tbodyHtml += `</tr>`;
            });
            tbodyHtml += `<tr class="total-row">`;
            tbodyHtml += `<td class="name-col" style="background:#1f2937 !important; color:#58a6ff; font-weight: 900; font-size: 0.8rem; white-space:normal !important; word-break:break-word !important; padding:4px;">Havi Összesítő</td>`;
            days.forEach((item, dIndex) => {
                let d = item.date;
                let dayIndex = d.getDay();
                let isMonday = (dayIndex === 1);
                let prevWeekCheck = (isMonday && dIndex > 0) ? 'week-separator' : '';
                tbodyHtml += `<td id="col-total-${dIndex}" class="${prevWeekCheck}" style="font-weight:900; font-size:0.95rem;">0h</td>`;
            });
            tbodyHtml += `<td id="grand-total-hours" style="color:#58a6ff; font-weight:900; font-size:0.95rem; white-space:nowrap;">0h</td>`;
            tbodyHtml += `</tr>`;
            document.getElementById('tableBody').innerHTML = tbodyHtml;
            document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)').forEach(row => {
                calculateRowHours(row);
            });
            calculateColumnTotals(days);
            runAuditEngine(days, year, month);
            runVacationEngine(year, month);
        }
        function updateRequired(input) {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            let dKey = input.dataset.date;
            
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            savedRequired[dKey] = parseInt(input.value) || 0;
            localStorage.setItem(`matrix_required_${year}_${month}`, JSON.stringify(savedRequired));
            generateCalendar();
        }
        function selectCell(cell) {
            if(cell.classList.contains('cell-locked') && cell.innerText.trim() !== '') return;
            if(activeCell) activeCell.classList.remove('selected-cell');
            activeCell = cell;
            activeCell.classList.add('selected-cell');
        }
        function applyServiceWithPos(prefix, className, type) {
            let numId = type === 'np' ? 'npNum' : (type === 'ep' ? 'epNum' : 'nepNum');
            let numVal = document.getElementById(numId).value;
            applyService(prefix + numVal, className, type);
        }
        function applyService(text, className, type) {
            if(!activeCell || activeCell.classList.contains('cell-locked')) {
                alert('⚠️ Először kattints rá egy szerkeszthető cellára a tárgyhónapban!');
                return;
            }
            let prevCell = activeCell.previousElementSibling;
            if(prevCell && prevCell.dataset) {
                let prevType = prevCell.dataset.type;
                if(type === 'np' && (prevType === 'ep' || prevType === 'nep')) {
                    alert('⚠️ Biztonsági figyelmeztetés: Éjszakai vagy 24 órás szolgálat után nem lehet közvetlenül Nappal!');
                    return;
                }
            }
            let hasSeparator = activeCell.classList.contains('week-separator') ? 'week-separator' : '';
            activeCell.className = className + ' ' + hasSeparator + ' selected-cell';
            activeCell.innerText = text;
            activeCell.dataset.type = type;
            let dKey = activeCell.dataset.date;
            let gIndex = activeCell.dataset.guard;
            if(dKey && gIndex !== undefined) {
                let cellDataToSave = { text: text, className: className, type: type };
                localStorage.setItem(`global_cell_${dKey}_g_${gIndex}`, JSON.stringify(cellDataToSave));
            }
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            let days = [];
            let currentMonthDays = new Date(year, month + 1, 0).getDate();
            for(let i = 1; i <= currentMonthDays; i++) {
                days.push({ date: new Date(year, month, i) });
            }
            document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)').forEach(row => {
                calculateRowHours(row);
            });
            calculateColumnTotals(days);
            autoSave();
            runAuditEngine(days, year, month);
            runVacationEngine(year, month);
        }
        function calculateRowHours(row) {
            let cells = row.querySelectorAll('td');
            let totalHours = 0;
            for(let i = 1; i < cells.length - 1; i++) {
                let type = cells[i].dataset.type;
                if(type === 'np' || type === 'ep' || type === 'szb') {
                    totalHours += 12;
                } else if(type === 'nep') {
                    totalHours += 24;
                }
            }
            let hoursCell = cells[cells.length - 1];
            hoursCell.innerHTML = `<b>${totalHours}h</b>`;
        }
        function calculateColumnTotals(days) {
            let colCount = days.length;
            let colTotals = new Array(colCount).fill(0);
            let grandTotal = 0;
            let rows = document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)');
            rows.forEach(row => {
                let cells = row.querySelectorAll('td');
                for(let i = 1; i <= colCount; i++) {
                    let type = cells[i].dataset.type;
                    let h = 0;
                    if(type === 'np' || type === 'ep' || type === 'szb') h = 12;
                    else if(type === 'nep') h = 24;
                    
                    colTotals[i - 1] += h;
                }
            });
            for(let i = 0; i < colCount; i++) {
                let colCell = document.getElementById(`col-total-${i}`);
                if(colCell) {
                    colCell.innerText = colTotals[i] > 0 ? colTotals[i] + 'h' : '0h';
                }
            }
            rows.forEach(row => {
                let cells = row.querySelectorAll('td');
                let lastCell = cells[cells.length - 1];
                let val = parseInt(lastCell.innerText) || 0;
                grandTotal += val;
            });
            let grandCell = document.getElementById('grand-total-hours');
            if(grandCell) {
                grandCell.innerHTML = `<b>${grandTotal}h</b>`;
            }
        }
        function updateVacationBase(gIndex, input) {
            let val = parseInt(input.value) || 0;
            localStorage.setItem(`vacation_base_${gIndex}`, val);
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            runVacationEngine(year, month);
        }
        function runVacationEngine(year, month) {
            let currentGuards = [];
            for(let i = 0; i < 20; i++) {
                let nameInput = document.getElementById(`guard-name-${i}`);
                currentGuards.push(nameInput ? nameInput.value : `Őr ${i+1}`);
            }
            let gridHtml = '';
            
            currentGuards.forEach((guardName, gIndex) => {
                if(!guardName) guardName = `Őr ${gIndex+1}`;
                
                let baseKey = `vacation_base_${gIndex}`;
                let baseVal = localStorage.getItem(baseKey) !== null ? parseInt(localStorage.getItem(baseKey)) : 30;
                let totalUsedUntilNow = 0;
                for(let m = 0; m <= month; m++) {
                    let mDays = new Date(year, m + 1, 0).getDate();
                    let mSavedSchedule = JSON.parse(localStorage.getItem(`matrix_schedule_${year}_${m}`)) || {};
                    
                    for(let d = 0; d < mDays; d++) {
                        let cellKey = `g_${gIndex}_d_${d}`;
                        let dObj = new Date(year, m, d + 1);
                        let dKey = getDateKey(dObj);
                        let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`)) || mSavedSchedule[cellKey];
                        
                        if(globalData && globalData.type === 'szb') {
                            totalUsedUntilNow++;
                        }
                    }
                }
                let remaining = baseVal - totalUsedUntilNow;
                gridHtml += `
                    <div class="vacation-card">
                        <div class="vacation-card-header">${guardName}</div>
                        <div class="vacation-card-body">
                            <span>Alap: <input type="number" value="${baseVal}" min="0" max="100" style="width:36px; text-align:center; background:#161b22; color:#58a6ff; border:1px solid var(--border-color); border-radius:3px; font-weight:bold; font-size:0.75rem;" onchange="updateVacationBase(${gIndex}, this)"></span>
                            <span>Felhasznált: <b style="color:var(--yellow);">${totalUsedUntilNow}</b></span>
                            <span>Maradék: <b style="color:var(--blue);">${remaining}</b></span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('vacationReport').innerHTML = gridHtml;
        }
        function runAuditEngine(days, year, month) {
            let savedRequired = JSON.parse(localStorage.getItem(`matrix_required_${year}_${month}`)) || {};
            let issues = [];
            let currentGuards = [];
            for(let i = 0; i < 20; i++) {
                let nameInput = document.getElementById(`guard-name-${i}`);
                currentGuards.push(nameInput ? nameInput.value : `Őr ${i+1}`);
            }
            days.forEach(item => {
                if (item.isExtra) return;
                let dKey = getDateKey(item.date);
                let requiredCount = savedRequired[dKey] !== undefined ? savedRequired[dKey] : 2;
                
                let actualCount = 0;
                currentGuards.forEach((_, gIndex) => {
                    let globalData = JSON.parse(localStorage.getItem(`global_cell_${dKey}_g_${gIndex}`));
                    if (globalData && globalData.type && (globalData.type === 'np' || globalData.type === 'ep' || globalData.type === 'nep')) {
                        actualCount++;
                    }
                });
                let ledSpan = document.getElementById(`led-${dKey}`);
                if (ledSpan) {
                    if (actualCount < requiredCount) {
                        ledSpan.innerHTML = `<span class="led-alert" title="Hiány: ${actualCount}/${requiredCount}"></span>`;
                        issues.push({ date: `${item.date.getMonth()+1}.${item.date.getDate()}.`, type: 'hiány', diff: requiredCount - actualCount });
                    } else if (actualCount > requiredCount) {
                        ledSpan.innerHTML = `<span class="led-warning" title="Többlet: ${actualCount}/${requiredCount}"></span>`;
                        issues.push({ date: `${item.date.getMonth()+1}.${item.date.getDate()}.`, type: 'többlet', diff: actualCount - requiredCount });
                    } else {
                        ledSpan.innerHTML = `<span class="led-ok" title="Létszám rendben: ${actualCount}/${requiredCount}"></span>`;
                    }
                }
            });
            let reportHtml = '';
            let deficits = issues.filter(i => i.type === 'hiány');
            let surpluses = issues.filter(i => i.type === 'többlet');
            if (issues.length === 0) {
                reportHtml = `<span class="alert-badge alert-ok">MINDEN PONTOS</span> A létszám keret tökéletesen teljesül!`;
            } else {
                reportHtml = `<span class="alert-badge alert-error">${deficits.length} hiány (LED)</span> | <span class="alert-badge alert-warning">${surpluses.length} többlet (LED)</span>`;
            }
            document.getElementById('auditReport').innerHTML = reportHtml;
        }
        function autoSave() {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            
            let currentGuards = [];
            for(let i = 0; i < 20; i++) {
                let nameInput = document.getElementById(`guard-name-${i}`);
                currentGuards.push(nameInput ? nameInput.value : `Őr ${i+1}`);
            }
            localStorage.setItem(`matrix_guards_${year}_${month}`, JSON.stringify(currentGuards));
            let dataToSave = {};
            document.querySelectorAll('#scheduleTable tbody tr:not(.total-row)').forEach((row, gIndex) => {
                row.querySelectorAll('td').forEach((cell, cIndex) => {
                    if(cIndex > 0 && cIndex < row.querySelectorAll('td').length - 1) {
                        let cellKey = cell.dataset.key;
                        let dKey = cell.dataset.date;
                        if(cellKey && !cell.classList.contains('cell-locked')) {
                            let cellInfo = {
                                text: cell.innerText,
                                className: cell.className.replace('selected-cell', '').trim(),
                                type: cell.type || cell.dataset.type
                            };
                            dataToSave[cellKey] = cellInfo;
                            if(dKey) {
                                localStorage.setItem(`global_cell_${dKey}_g_${gIndex}`, JSON.stringify(cellInfo));
                            }
                        }
                    }
                });
            });
            localStorage.setItem(`matrix_schedule_${year}_${month}`, JSON.stringify(dataToSave));
            runVacationEngine(year, month);
        }
        function manualSave() {
            autoSave();
            alert('💾 A Mátrix Labor adatai, a névsor és az egyedi szabadságkeretek sikeresen mentve!');
        }
        function exportDirectPdf() {
            let tableHtml = document.querySelector('.table-container').innerHTML;
            let vacationHtml = document.getElementById('vacationReport').innerHTML;
            let auditHtml = document.getElementById('auditReport').innerHTML;
            let holidayHtml = document.getElementById('holidayReport').innerHTML;
            
            let exportContainer = document.getElementById('pdfExportContainer');
            exportContainer.style.display = 'block';
            
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = tableHtml;
            tempDiv.querySelectorAll('textarea').forEach((ta, idx) => {
                let val = ta.value || `Őr ${idx+1}`;
                let nameSpan = document.createElement('div');
                nameSpan.style.cssText = "font-weight: 900; font-size: 9px; line-height: 1.2; white-space: normal; word-break: break-word; color: #000;";
                nameSpan.innerText = val;
                ta.parentNode.replaceChild(nameSpan, ta);
            });
            let cleanTableHtml = tempDiv.innerHTML;

            exportContainer.innerHTML = `
                <div style="font-family: sans-serif; background: #fff; color: #000; padding: 10px; width: 1100px;">
                    <h1 style="text-align: center; font-size: 14px; margin: 2px 0; color: #1f6feb;">Mátrix Labor — Hivatalos Vezetőségi Jelentés</h1>
                    <div style="text-align: center; font-size: 9px; margin-bottom: 8px; color: #555;">Tartalmazza a havi vezénylési táblázatot, az éves szabadságkezelőt és a havi összesítőket</div>
                    
                    <div style="font-size: 11px; font-weight: bold; margin-top: 8px; margin-bottom: 4px; border-bottom: 2px solid #1f6feb; padding-bottom: 2px; color: #1f6feb;">1. Havi Vezénylési Táblázat</div>
                    <div>${cleanTableHtml}</div>
                    
                    <div style="font-size: 11px; font-weight: bold; margin-top: 15px; margin-bottom: 4px; border-bottom: 2px solid #1f6feb; padding-bottom: 2px; color: #1f6feb;">2. Éves Göngyölített Szabadságkezelő & Keretek (Mind a 20 Őr)</div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px;">
                        ${vacationHtml}
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; margin-top: 10px;">
                        <div style="border: 1px solid #333; border-radius: 3px; padding: 6px; font-size: 9px; background: #f9fafb;">
                            <h3 style="margin: 0 0 3px 0; font-size: 10px; color: #1f6feb;">🔍 Létszám Figyelőmotor Összesítés</h3>
                            <div>${auditHtml}</div>
                        </div>
                        <div style="border: 1px solid #333; border-radius: 3px; padding: 6px; font-size: 9px; background: #f9fafb;">
                            <h3 style="margin: 0 0 3px 0; font-size: 10px; color: #1f6feb;">🎉 Havi Ünnepnapok Számláló</h3>
                            <div>${holidayHtml}</div>
                        </div>
                    </div>
                </div>
            `;
            
            let tempTable = exportContainer.querySelector('table');
            if(tempTable) {
                tempTable.style.width = '100%';
                tempTable.style.fontSize = '9px';
                tempTable.style.borderCollapse = 'collapse';
                tempTable.querySelectorAll('th, td').forEach(cell => {
                    cell.style.border = '1px solid #333';
                    cell.style.padding = '4px 2px';
                });
                exportContainer.querySelectorAll('.name-col').forEach(el => {
                    el.style.width = '150px';
                    el.style.minWidth = '150px';
                    el.style.maxWidth = '150px';
                    el.style.whiteSpace = 'normal';
                    el.style.wordBreak = 'break-word';
                    el.style.fontSize = '9px';
                    el.style.backgroundColor = '#f0f4f8';
                    el.style.color = '#000';
                });
            }

            let opt = {
                margin:       5,
                filename:     'Matrix_Labor_Vezetosegi_Jelentes.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().from(exportContainer).set(opt).save().then(() => {
                exportContainer.style.display = 'none';
                exportContainer.innerHTML = '';
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            generateCalendar();
        });
    </script>
</body>
